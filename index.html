<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<meta name="theme-color" content="#4f46e5">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSE Students Marks Tracker</title>
<style>
:root{--bg:#f5f6fa;--card:#fff;--tx:#1b1f2a;--mut:#667085;--bd:#dfe3ec;--ac:#3b5bdb;--bad:#e03131}
@media(prefers-color-scheme:dark){:root{--bg:#12141b;--card:#1b1e28;--tx:#eceff6;--mut:#99a1b3;--bd:#2d3243;--ac:#7c93ff;--bad:#ff6b6b}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,sans-serif}
header{text-align:center;padding:28px 16px 10px}h1{margin:0;font-size:26px}.by{color:var(--mut);margin:2px 0 0}
main{max-width:960px;margin:auto;padding:12px 16px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px;width:100%}
input.over{border-color:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.grp{grid-column:1/-1;border:1px solid var(--bd);border-radius:8px;padding:10px}.grp b{font-size:13px;display:block;margin-bottom:6px}
label{font-size:12px;color:var(--mut);display:block;margin-bottom:3px}
h2{margin:0 0 2px;font-size:18px}h3{margin:14px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
.tag{font-size:12px;color:var(--mut)}.tot{font-weight:600;color:var(--ac)}
.head{display:flex;justify-content:space-between;align-items:baseline;flex-wrap:wrap;gap:6px}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.sum div{background:var(--bg);border-radius:8px;padding:10px;text-align:center}.sum b{display:block;font-size:20px}
button{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:8px;padding:7px 12px;cursor:pointer}
details summary{cursor:pointer;color:var(--ac)}.note{font-size:12.5px;color:var(--mut)}
</style></head><body>
<header><h1>CSE Students Marks Tracker</h1><p class="by">by Shravan</p></header>
<main>
<div class="card"><div class="row">
<div style="flex:1;min-width:180px"><label>Student name</label><input id="name" placeholder="Your name"></div>
<div style="flex:1;min-width:180px"><label>USN</label><input id="usn" placeholder="e.g. 1RN25CS001"></div></div>
<p class="note" style="margin:10px 0 0">🔒 Your marks are saved only in this browser on this device. Nobody else can see them.</p></div>
<div class="card"><h2>Overall summary</h2><div class="sum" id="overall" style="margin-top:10px"></div></div>
<div id="subjects"></div>
<div class="card"><details><summary>Settings: maximum marks for each subject</summary>
<div id="maxes"></div>
<div class="row" style="margin-top:12px"><button id="reset">Clear all my marks</button></div></details></div>
</main>
<script>
// [key, name, hasLab, number of lab experiments]
const SUBJ=[["maths","Mathematics",0,0],["chem","Chemistry",1,10],["caed","CAED",1,0],["plc","PLC",1,0],["esc","ESC (Civil)",0,0],["eng","English",0,0]];
const ML={ia:"Internal Test",ext:"External Test",asg:"Assignment",viva:"Lab Viva",wu:"Lab Procedure/Write-up",cond:"Lab Conduction"};
const defMax=k=>({ia:k=="eng"?30:50,ext:100,asg:10,viva:10,wu:10,cond:30});
const LF=[["viva","Viva"],["wu","Procedure / Write-up"],["cond","Conduction"]];
const KEY="cse_marks_tracker_v2";
let S;try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}
S=S||{};S.p=S.p||{};S.m=S.m||{};S.max=S.max||{};
SUBJ.forEach(([k])=>S.max[k]=Object.assign(defMax(k),S.max[k]));
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const one=(f,l,t)=>({l,f:[[f,l,t]],single:1});
const lab=(p,l)=>({l,f:LF.map(([x,n])=>[p+"_"+x,n,x])});
function secs(k){const [,,hl,n]=SUBJ.find(s=>s[0]==k);
 const s=[["Internal tests",[one("ia1","Internal Test 1","ia"),one("ia2","Internal Test 2","ia")]],
 ["Assignments",[1,2,3].map(i=>one("a"+i,"Assignment "+i,"asg"))]];
 if(n)s.push(["Lab experiments",Array.from({length:n},(_,i)=>lab("e"+(i+1),"Experiment "+(i+1)))]);
 if(hl)s.push(["Lab tests",[lab("li1","Lab Internal 1"),lab("li2","Lab Internal 2"),lab("lx","Lab External")]]);
 s.push(["External test",[one("ext","External Test","ext")]]);return s}
function calc(k){let g=0,gm=0;secs(k).forEach(([,gs])=>gs.forEach(x=>x.f.forEach(([f,,t])=>{
 const v=S.m[k+"_"+f];if(v!==undefined&&v!==""){g+=+v;gm+=S.max[k][t]}})));return{g,gm}}
const pct=(a,b)=>b?(a/b*100).toFixed(1)+"%":"–";
const inp=(k,f,l,t)=>`<div><label>${l} (/${S.max[k][t]})</label><input type="number" min="0" step="0.5" data-k="${k}_${f}" data-s="${k}" data-t="${t}" value="${S.m[k+"_"+f]??""}"></div>`;
function render(){
 $("subjects").innerHTML=SUBJ.map(([k,name,hl,n])=>`<div class="card"><div class="head"><h2>${name}</h2><span class="tot" id="t_${k}"></span></div>
 <div class="tag">${hl?"Theory + Lab":"Theory + Assignments"}</div>
 ${secs(k).map(([sn,gs])=>`<h3>${sn}</h3><div class="grid">${gs.map(x=>x.single?inp(k,x.f[0][0],x.f[0][1],x.f[0][2]):
 `<div class="grp"><b>${x.l}</b><div class="grid">${x.f.map(([f,l,t])=>inp(k,f,l,t)).join("")}</div></div>`).join("")}</div>`).join("")}</div>`).join("");
 $("maxes").innerHTML=SUBJ.map(([k,name,hl])=>`<h3>${name}</h3><div class="grid">${Object.keys(ML).filter(t=>hl||!["viva","wu","cond"].includes(t)).map(t=>
 `<div><label>${ML[t]} max</label><input type="number" min="1" data-mk="${k}" data-mt="${t}" value="${S.max[k][t]}"></div>`).join("")}</div>`).join("");
 $("name").value=S.p.name||"";$("usn").value=S.p.usn||"";update()}
function update(){let G=0,GM=0,h="";
 SUBJ.forEach(([k,name])=>{const r=calc(k);G+=r.g;GM+=r.gm;$("t_"+k).textContent=r.gm?`${r.g} / ${r.gm} (${pct(r.g,r.gm)})`:"No marks yet";
 h+=`<div><span class="tag">${name}</span><b>${pct(r.g,r.gm)}</b></div>`});
 $("overall").innerHTML=`<div><span class="tag">Total entered</span><b>${G} / ${GM}</b></div><div><span class="tag">Overall %</span><b>${pct(G,GM)}</b></div>`+h}
document.addEventListener("input",e=>{const i=e.target;
 if(i.dataset.k){i.classList.toggle("over",+i.value>S.max[i.dataset.s][i.dataset.t]||+i.value<0);S.m[i.dataset.k]=i.value;save();update()}
 else if(i.dataset.mk){S.max[i.dataset.mk][i.dataset.mt]=+i.value||defMax(i.dataset.mk)[i.dataset.mt];save();
  document.querySelectorAll(`[data-s="${i.dataset.mk}"][data-t="${i.dataset.mt}"]`).forEach(x=>{x.previousElementSibling.textContent=x.previousElementSibling.textContent.replace(/\(\/.*\)/,`(/${S.max[i.dataset.mk][i.dataset.mt]})`)});update()}
 else if(i.id=="name"||i.id=="usn"){S.p[i.id]=i.value;save()}});
$("reset").onclick=()=>{if(confirm("Clear all your saved marks?")){S.m={};save();render()}};
render();
</script></body></html>
